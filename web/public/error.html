<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" />
    <title>Sparkee · 连不上</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --ink: #1b2000;
        --muted: #6b7280;
        --lime: #d4f322;
        --line: rgba(27, 32, 0, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0e11;
          --ink: #f2f4f8;
          --muted: #9aa1ad;
          --line: rgba(255, 255, 255, 0.14);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      main { width: 100%; max-width: 340px; text-align: center; }
      img { width: 76px; height: 76px; border-radius: 20px; }
      h1 { margin: 18px 0 8px; font-size: 20px; font-weight: 650; }
      p { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.6; }
      button {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 12px;
        background: var(--lime);
        color: #1b2000;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      a { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 13px; }
      .hint { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>连不上 Sparkee</h1>
      <p>请检查网络后重试。笔记都在服务器上，不会因为这次失败丢失。</p>
      <button onclick="location.reload()">重新加载</button>
      <a href="/">在浏览器中打开</a>
      <p class="hint">如果一直失败，可能是 Cloudflare 或网络暂时不可用。</p>
    </main>
  </body>
</html>
