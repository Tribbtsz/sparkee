name: 功能建议
description: 想要新的能力，或改现有的交互
title: '[feat] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Sparkee 的定位是**极简**：一个输入框、一份卡片流、一本待办。提之前先想想能不能
        不介绍面、不引依赖就解决。大改动希望先在这里对齐方向，再写代码。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 描述场景，而不是先给方案
      placeholder: 记待办时……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 交互或行为上的期望；如果想过实现思路也可以写
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 有没有别的办法
      description: 现在是怎么绕过去的？为什么不满意？
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 搜过现有 issue，没有重复
          required: true
        - label: 这个建议不会让项目引入重型依赖或后端常驻服务
          required: true
